name: Hydroponic AI MVP CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: smartlabel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reject newly added runtime data, secrets, and deploy artifacts
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch origin main --depth=1
            BASE_SHA="$(git merge-base origin/main HEAD)"
          fi
          python scripts/check_repository_hygiene.py --base-ref "$BASE_SHA"

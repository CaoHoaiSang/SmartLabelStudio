name: Hydroponic AI MVP CI

on:
  push:
    branches: [feature/hydroponic-ai-mvp-v1]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reject new runtime data and deploy artifacts
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(workspace|data|runs|exports)/|\.(pt|pth|ckpt|onnx|engine|rknn)$' || true)"
          test -z "$forbidden" || { echo "$forbidden"; exit 1; }

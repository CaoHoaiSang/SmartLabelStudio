name: Hydroponic AI MVP CI

on:
  push:
    branches: [feature/hydroponic-ai-mvp-v1]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Reject newly added runtime data and deploy artifacts
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git merge-base origin/main HEAD)"
          fi
          forbidden="$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD | grep -E '(^|/)(workspace|data|runs|exports)/|\.(pt|pth|ckpt|onnx|engine|rknn)$' || true)"
          test -z "$forbidden" || { echo "$forbidden"; exit 1; }
